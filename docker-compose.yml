services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
    networks:
      - frontend_net

  backend-api:
    build: ./app
    container_name: backend-api
    env_file:
      - .env
    depends_on:
      - redis-db
    networks:
      - frontend_net
      - backend_net

  redis-db:
    image: redis:7-alpine
    container_name: redis-db
    volumes:
      - redis_data:/data
    networks:
      - backend_net

volumes:
  redis_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
